version: 2

sources:
  - name: sales                     # source name
    database: DBO_PROD
    schema: sales                   # schema name
    quoting:
      identifier: true              # tells dbt to quote table names
    tables:
      - name: dim_location_details  # dbt name (lowercase ok)
        identifier: dim_location_details   # real table name inside ""
        description: "Raw dim_location_details table from sales schema"

      - name: dim_channel_details
        description: "Raw channel details "
        columns:
          - name: channel_id
            description: "Primary key for CHANNEL_ID"

      - name: dim_employee_details
        description: "Raw employee details"
        columns:
          - name: EMPLOYEE_ID
            description: "Primary key for EMPLOYEE_ID"
      - name: dim_distributor_details
        description: "Raw distrubutor details"
        columns:
          - name: DISTRIBUTOR_ID
            description: "Primary key for DISTRIBUTOR_ID" 
      - name: dim_product_details
        description: "Raw product details"
        columns:
          - name: PRODUCT_ID
            description: "Primary key for PRODUCT_ID" #DIM_SALES_TEAM_DETAILS
      - name: dim_sales_team_details
        description: "Raw sales details"
        columns:
          - name: SALES_TEAM_ID
            description: "Primary key for SALES_TEAM_ID"
      - name: dim_shipping_details
        description: "Raw shipping details"
        columns:
          - name: SHIPPING_ID
            description: "Primary key for SHIPPING_ID" #DBO_PROD
      - name: dim_date
        description: "Raw DATE details" #DBO_PROD

      - name: fact_sales
        description: "Raw fact_sales details"
        columns:
          - name: LOCATION_ID,CHANNEL_ID,EMPLOYEE_ID,DISTRIBUTOR_ID,PRODUCT_ID,SALES_TEAM_ID,SHIPPING_ID
            description: " this is fat table all FK is here" 