name: prod_analytical_env
version: 1.0.0
profile: prod_analytical_env

config-version: 2

# ---------------------------------------
#  FOLDER → SCHEMA LOGIC (Your Requirement)
# ---------------------------------------
models:

  prod_analytical_env:      # ← this MUST match "name:" above

    source:
      sales:
        +schema: sales
      retail:
        +schema: retail

    intermediate:
      sales:
        +schema: sales
      retail:
        +schema: retail

    mart:
      sales:
        +schema: sales
      retail:
        +schema: retail

# ---------------------------------------
#  DEFAULT SCHEMA SETTINGS
# ---------------------------------------
# When you run locally → schema = rvats
# When job runs → schema overridden by folder above
vars:
  DBT_SCHEMA: "{{ env_var('DBT_SCHEMA', 'rvats') }}"
