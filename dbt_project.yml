name: 'edna'
version: '1.4.7'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

models:
  # Default for entire project → VIEW
  +bind: false
  +materialized: view

  edna:

    # SOURCES → always VIEW (local + prod)
    sources:
      +materialized: view

    # INTERMEDIATE → always VIEW (local + prod)
    intermediate:
      +materialized: view

    # MARTS → always TABLE (local + prod)
    marts:
      +materialized: table

      # SALES mart tables → always land in SALES schema (only applies when running in prod)
      sales:
        +schema: sales
